name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: employee_db
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uci_user -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set database environment variables
        run: |
          echo "DB_USERNAME=ci_user" >> $GITHUB_ENV
          echo "DB_PASSWORD=ci_password" >> $GITHUB_ENV
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=3306" >> $GITHUB_ENV
          echo "DB_NAME=employee_db" >> $GITHUB_ENV
          echo "SECRET_KEY=ci-test-secret-key" >> $GITHUB_ENV

      - name: Initialize database
        run: |
          python -c "from app.database import Base, engine; Base.metadata.create_all(bind=engine)"

      - name: Run tests
        run: |
          pytest --cov=app --cov-report=term